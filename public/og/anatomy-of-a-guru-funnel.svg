  <text x="1120" y="525" fill="#737066" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" text-anchor="end" letter-spacing="0.05em">EDUCATIONAL ARCHIVE</text>
